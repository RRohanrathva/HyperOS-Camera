name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: unzip -q HyperOS-Camera-Android.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'
      - name: Build debug APK
        working-directory: HyperOS-Camera-Android
        run: gradle :app:assembleDebug --stacktrace --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: HyperOS-Camera-Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.0.${{ github.run_number }}" HyperOS-Camera-Android/app/build/outputs/apk/debug/app-debug.apk \
            --title "Debug build ${{ github.run_number }}" --latest
